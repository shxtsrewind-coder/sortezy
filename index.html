    <!--
      Critical boot styles — paint before the JS bundle and Tailwind's CSS
      arrive, so the first frame is the dark background and a loading mark
      rather than a flash of white.
    -->
    <style>
      html,
      body {
        background-color: #ffffff;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background-color: #ffffff;
        background-image: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(0, 0, 0, 0), transparent 60%);
        transition: opacity 0.25s ease;
      }
      #initial-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #initial-loader .mark {
        display: flex;
        gap: 4px;
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 600;
        font-size: 18px;
      }
      #initial-loader .mark span {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 5px;
        color: #ffffff;
        animation: sc-hop 1.2s ease-in-out infinite;
      }
      #initial-loader .mark span:nth-child(odd) { background: #3a8b55; }
      #initial-loader .mark span:nth-child(even) { background: #b5841e; }
      #initial-loader .mark span:nth-child(2) { animation-delay: 0.1s; }
      #initial-loader .mark span:nth-child(3) { animation-delay: 0.2s; }
      #initial-loader .mark span:nth-child(4) { animation-delay: 0.3s; }
      #initial-loader .mark span:nth-child(5) { animation-delay: 0.4s; }
      #initial-loader .mark span:nth-child(6) { animation-delay: 0.5s; }
      #initial-loader .mark span:nth-child(7) { animation-delay: 0.6s; }
      #initial-loader .mark span:nth-child(8) { animation-delay: 0.7s; }
      #initial-loader .caption {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: #5c5c5c;
      }
      @keyframes sc-hop {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-6px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader .mark span { animation: none; }
      }
    </style>
  </head>
  <body class="bg-[#ffffff] text-paper antialiased">
    <div id="initial-loader" aria-live="polite" aria-label="Loading Sortezy">
      <div class="mark"><span>S</span><span>O</span><span>R</span><span>T</span></div>
      <div class="caption">Filling the tubes&hellip;</div>
    </div>
    <div id="root"></div>
    <noscript>
      <h1>Sortezy — a free daily water sort puzzle</h1>
      <p>
        Pour coloured water between glass tubes until every tube holds a single colour. You can only pour onto the same
        colour or into an empty tube. There's a new puzzle every day, the same for every player, with a move target for
        three stars and a daily leaderboard, plus numbered levels that grow from 3 colours to 12. Sortezy needs
        JavaScript to play.
      </p>
      <p>More free games: <a href="https://wordezy.bgameworld.com/">Wordezy</a>, <a href="https://wordezysearch.bgameworld.com/">Wordezy Search</a>, <a href="https://wordezyscramble.bgameworld.com/">Wordezy Scramble</a>, <a href="https://wordezyladder.bgameworld.com/">Wordezy Ladder</a>, <a href="https://whenandwhere.bgameworld.com/">When &amp; Where</a>.</p>
